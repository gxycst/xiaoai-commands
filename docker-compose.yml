services:
  manager:
    build: .
    image: local/xiaoai-commands:1.0
    container_name: xiaoai-commands
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?请先运行 configure.sh 或填写 .env}
      COMMANDS_DIR: /config/skills
      HOST: 0.0.0.0
      PORT: "9528"
    ports:
      - "${NAS_LAN_IP:?请在 .env 中填写 NAS 内网 IPv4 地址}:9528:9528"
    volumes:
      - type: bind
        source: /volume2/ssd_docker/xiaogpt/config/skills
        target: /config/skills
        read_only: false
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9528/api/session', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
